services:
  ruby:
    build: .
    volumes:
      - .:/MyWedding
      - gems:/usr/local/bundle
  db:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql

  api:
    build: .
    working_dir: /MyWedding/apps/api
    command: bin/rails server -b 0.0.0.0
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432
    depends_on:
      - db
    volumes:
      - .:/MyWedding
      - gems:/usr/local/bundle

volumes:
  gems:
  pgdata:
